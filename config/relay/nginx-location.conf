# Include inside the operator's existing TLS server block.
# Only this exact WebSocket endpoint is routed to the private relay listener.
location = /supervm/relay {
    proxy_pass https://127.0.0.1:45172/novovm;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/supervm/tls.cert;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_request_buffering off;
    access_log off;
}
