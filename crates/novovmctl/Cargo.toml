[package]
name = "novovmctl"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "1"
novovm-governance-observability = { path = "../novovm-governance-observability" }
novovm-node = { path = "../novovm-node" }
novovm-relay = { path = "../novovm-relay" }
novovm-exec = { path = "../novovm-exec" }

[dev-dependencies]
aoem-bindings = { path = "../aoem-bindings" }
ed25519-dalek = "2"
novovm-protocol = { path = "../novovm-protocol" }
rocksdb = { version = "0.22", default-features = false }
