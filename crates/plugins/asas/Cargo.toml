[package]
name = "novovm-asas-plugin"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "NOVOVM-owned ASAS application worker lifecycle; no independent network"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "io-std", "time", "rt", "macros"] }
