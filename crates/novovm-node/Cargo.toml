[package]
name = "novovm-node"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
autobins = false

[dependencies]
anyhow = "1"
aoem-bindings = { path = "../aoem-bindings" }
base64 = "0.22"
novovm-exec = { path = "../novovm-exec" }
novovm-consensus = { path = "../novovm-consensus" }
novovm-network = { path = "../novovm-network" }
novovm-udp-batch = { path = "../novovm-udp-batch" }
novovm-protocol = { path = "../novovm-protocol" }
novovm-adapter-api = { path = "../novovm-adapter-api" }
novovm-governance-observability = { path = "../novovm-governance-observability" }
novovm-adapter-novovm = { path = "../novovm-adapter-novovm" }
novovm-adapter-evm-core = { path = "../plugins/evm/core" }
novovm-adapter-evm-plugin = { path = "../plugins/evm/plugin" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
libloading = "0.8"
socket2 = "0.6"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiny_http = "0.12"
rocksdb = { version = "0.22", default-features = false }
ureq = "2"
lettre = "0.11"

[[bin]]
name = "novovm-node"
path = "src/bin/novovm-node.rs"

[[bin]]
name = "supervm-mainline-gate"
path = "src/bin/supervm-mainline-gate.rs"

[[bin]]
name = "supervm-mainline-preflight"
path = "src/bin/supervm-mainline-preflight.rs"

[[bin]]
name = "supervm-mainline-query"
path = "src/bin/supervm-mainline-query.rs"

[[bin]]
name = "supervm-mainline-geth-sample-sync"
path = "src/bin/supervm-mainline-geth-sample-sync.rs"

[[bin]]
name = "supervm-mainline-soak"
path = "src/bin/supervm-mainline-soak.rs"

[[bin]]
name = "supervm-mainline-nightly-gate"
path = "src/bin/supervm-mainline-nightly-gate.rs"

[[bin]]
