[package]
name = "novovm-relay"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Standalone deployment of the existing SuperVM opaque relay runtime"

[features]
default = []
iroh-transport = ["novovm-network/iroh-transport", "dep:futures-util"]

[dependencies]
futures-util = { version = "0.3", optional = true }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
novovm-network = { path = "../novovm-network" }
rand = "0.8"
rustls = "0.23.45"
rustls-native-certs = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(windows)'.dependencies]
mio = { version = "1.1.1", default-features = false, features = ["os-poll", "net"] }

windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
rcgen = "0.12"
socket2 = "0.6"

[[bin]]
name = "supervm-relay"
path = "src/main.rs"

[[bin]]
name = "novovm-rendezvous-service"
path = "src/rendezvous_service.rs"
required-features = ["iroh-transport"]

[[bin]]
name = "novovm-bootstrap-publisher"
path = "src/bootstrap_publisher.rs"
required-features = ["iroh-transport"]

[[bin]]
name = "novovm-bootstrap-mirror"
path = "src/bootstrap_mirror.rs"
required-features = ["iroh-transport"]
