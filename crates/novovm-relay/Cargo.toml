[package]
name = "novovm-relay"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Standalone deployment of the existing SuperVM opaque relay runtime"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
novovm-network = { path = "../novovm-network" }
rand = "0.8"
rustls = "0.23.45"
rustls-native-certs = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
rcgen = "0.12"

[[bin]]
name = "supervm-relay"
path = "src/main.rs"
