[package]
name = "novovm-network"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["SuperVM Core Team"]
description = "NOVOVM network abstraction (transport traits + in-memory impl)."

[features]
default = []
iroh-transport = ["dep:iroh", "dep:futures-util"]
tls-transport = ["dep:tokio-rustls", "dep:curve25519-dalek", "tokio/net"]
mailbox-seal = ["dep:hpke", "dep:rand09"]

[dependencies]
futures-util = { version = "0.3", optional = true }
aes = "0.8"
anyhow = "1"
base64 = "=0.22.1"
chacha20poly1305 = "0.10"
ctr = "0.9"
curve25519-dalek = { version = "4", optional = true }
dashmap = "6.1"
ed25519-dalek = "2"
hkdf = "0.12"
hpke = { version = "=0.13.0", optional = true, default-features = false, features = ["std", "x25519"] }
hmac = "0.12"
iroh = { path = "../../vendor/iroh", version = "=1.3.0", optional = true, default-features = false, features = ["tls-aws-lc-rs"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh", "arithmetic"] }
mio = { version = "=1.1.1", default-features = false, features = ["os-poll", "net"] }
novovm-protocol = { path = "../novovm-protocol" }
rand = "0.8"
rand09 = { package = "rand", version = "=0.9.2", optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
subtle = "=2.6.1"
rustls = "=0.23.46"
rustls-native-certs = "=0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "=0.10.6"
sha2 = "0.10"
sha3 = "0.10"
snap = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }
tokio-rustls = { version = "=0.26.6", optional = true, default-features = false, features = ["aws_lc_rs"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "=0.4.4"

[target.'cfg(target_os = "android")'.dependencies]
# std::fs::File::try_lock is unsupported on Android in the pinned toolchain.
# Safe nonblocking flock; the network crate remains unsafe-free.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.23"
rcgen = "=0.12.1"
socket2 = "0.6"

[[example]]
name = "mailbox_peer_probe"
required-features = ["iroh-transport"]
