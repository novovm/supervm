[workspace]
members = ["runtime/novovm-host", "runtime/novovm-aoem", "runtime/novovm-network"]
default-members = ["runtime/novovm-host"]
exclude = ["legacy/supervm-20261002", "runtime/proofs/nov-transfer"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "=1.0.103"
sha2 = "=0.10.9"
libloading = "=0.8.9"
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }

[profile.release]
overflow-checks = true

[profile.test]
debug-assertions = true
overflow-checks = true
