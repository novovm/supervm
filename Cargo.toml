[workspace]
members = [
    "crates/aoem-bindings",
    "crates/novovm-adapter-api",
    "crates/novovm-adapter-novovm",
    "crates/gateways/evm-gateway",
    "crates/novovm-adapter-sample-plugin",
    "crates/plugins/evm/plugin",
    "crates/novovm-bench",
    "crates/novovm-consensus",
    "crates/novovm-coordinator",
    "crates/novovm-exec",
    "crates/novovm-governance-observability",
    "crates/novovm-network",
    "crates/novovm-relay",
    "crates/novovm-node",
    "crates/novovm-rollout-policy",
    "crates/novovm-udp-batch",
    "crates/novovmctl",
    "crates/novovm-protocol",
    "crates/novovm-prover",
    "vendor/web30-core",
]
# Retain post-isolation components as an independently tested implementation
# source, not a second default product or an unreviewed legacy dependency.
exclude = ["legacy/supervm-20261002", "runtime", "proofs/native-auth"]
resolver = "2"

# Keep the post-isolation release arithmetic checks when restoring assembly.
[profile.release]
overflow-checks = true

# Quorum/recovery tests repeatedly verify real signatures and hashes. Optimize
# those primitives without changing test coverage, debug assertions or overflow
# checks, or rebuilding the entire workspace/native database in release mode.
[profile.test]
debug-assertions = true
overflow-checks = true

[profile.test.package.curve25519-dalek]
opt-level = 3

[profile.test.package.ed25519-dalek]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
