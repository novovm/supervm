name: Replacement runtime modules (not mainnet acceptance)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replacement-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime_modules:
    name: Isolated runtime modules / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Reject legacy dependencies
        shell: pwsh
        run: ./runtime/check-isolation.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
