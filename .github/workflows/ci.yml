name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lan_script_launch:
    name: LAN diagnostic launcher checks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale builds and resolve local target paths
        shell: pwsh
        run: ./scripts/tests/overlay-gate-build.tests.ps1
      - name: Reject failed and misattributed LAN reports
        shell: pwsh
        run: ./scripts/tests/adaptive-overlay-aggregate.tests.ps1

  governance_pr_gate_observability:
    name: Governance PR Gate observability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Emit PR gate observability event
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/governance
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          with open(event_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          pr = payload.get("pull_request") or {}
          body = pr.get("body") or ""
          pr_id = str(pr.get("number", "unknown"))

          def checked(label: str) -> bool:
              pattern = r"-\s*\[(x|X)\]\s*" + re.escape(label)
              return re.search(pattern, body) is not None

          def inline_field(prefix_pattern: str) -> str:
              for line in body.splitlines():
                  stripped = line.strip()
                  if re.match(prefix_pattern, stripped, flags=re.IGNORECASE):
                      if ":" not in stripped:
                          return ""
                      value = stripped.split(":", 1)[1].strip()
                      return value
              return ""

          structural_change = checked(
              "This PR includes unified-account structural change. Trigger payload below is complete."
          )

          cutb_ref = checked(
              "`docs/NOVOVM-NETWORK/NOVOVM-ACCOUNT-PROTOCOL-CUTB-TRIGGER-CHECKLIST-2026-04-20.md`"
          ) or checked(
              "`docs_CN/NOVOVM-NETWORK/NOVOVM-ACCOUNT-PROTOCOL-CUTB-TRIGGER-CHECKLIST-2026-04-20.md`"
          )
          phase4_ref = checked(
              "`docs/NOVOVM-NETWORK/NOVOVM-ACCOUNT-PROTOCOL-PHASE4-TRIGGER-CHECKLIST-2026-04-20.md`"
          ) or checked(
              "`docs_CN/NOVOVM-NETWORK/NOVOVM-ACCOUNT-PROTOCOL-PHASE4-TRIGGER-CHECKLIST-2026-04-20.md`"
          )
          trigger_refs = cutb_ref or phase4_ref
          trigger_items = bool(inline_field(r"^2\.\s*Trigger item ID\(s\):"))
          evidence_links = bool(inline_field(r"^3\.\s*Evidence link\(s\)"))
          rollback_boundary = bool(
              inline_field(r"^4\.\s*Minimal irreversible slice and rollback boundary:")
          )
          decision_requested = checked("`Go`") or checked("`No-Go`")

          has_trigger = (
              structural_change
              and trigger_refs
              and trigger_items
              and evidence_links
              and rollback_boundary
              and decision_requested
          )
          trigger_valid = has_trigger if structural_change else None

          trigger_type = None
          if phase4_ref:
              trigger_type = "Phase4"
          elif cutb_ref:
              trigger_type = "CutB"

          governance_control_change = checked(
              "This PR modifies governance control documents and includes full governance proof chain."
          )
          governance_proposal = bool(inline_field(r"^1\.\s*Governance proposal reference:"))
          governance_vote = bool(inline_field(r"^2\.\s*Governance vote evidence:"))
          governance_execute = bool(
              inline_field(r"^3\.\s*Governance execute/activation evidence:")
          )
          has_governance_proof = (
              governance_proposal and governance_vote and governance_execute
          )

          accepted = True
          reason = None
          if structural_change and not has_trigger:
              accepted = False
              reason = "missing_trigger_payload"
          elif governance_control_change and not has_governance_proof:
              accepted = False
              reason = "missing_governance_proof_chain"

          record = {
              "at_unix_ms": int(time.time() * 1000),
              "source": "github_ci_pr_gate",
              "event": "pr_gate_evaluated",
              "pr_id": pr_id,
              "has_trigger": has_trigger,
              "trigger_valid": trigger_valid,
              "accepted": accepted,
              "reason": reason,
              "trigger_type": trigger_type,
              "governance_control_change": governance_control_change,
              "has_governance_proof": (
                  has_governance_proof if governance_control_change else True
              ),
          }

          output_path = Path("artifacts/governance") / f"governance-events-pr-gate-{pr_id}.jsonl"
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(json.dumps(record, ensure_ascii=False))
              handle.write("\n")
          print(f"emitted governance event: {output_path}")
          PY

      - name: Upload governance observability artifact
        uses: actions/upload-artifact@v4
        with:
          name: governance-pr-gate-events
          path: artifacts/governance/governance-events-pr-gate-*.jsonl
          if-no-files-found: error

  detect:
    name: Detect project types
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      rust_manifest: ${{ steps.detect.outputs.rust_manifest }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_node: ${{ steps.detect.outputs.has_node }}
      node_package_json: ${{ steps.detect.outputs.node_package_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          manifest=""
          if [ -f Cargo.toml ]; then
            manifest="Cargo.toml"
          else
            manifest="$(git ls-files -- '**/Cargo.toml' ':!:legacy/**' ':!:runtime/**' | head -n 1 || true)"
          fi
          if [ -n "${manifest}" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            echo "rust_manifest=${manifest}" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-files -- '*.py' ':!:legacy/**' | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

          node_pkg=""
          if [ -f package.json ]; then
            node_pkg="package.json"
          else
            node_pkg="$(git ls-files -- '**/package.json' ':!:legacy/**' ':!:runtime/**' | head -n 1 || true)"
          fi
          if [ -n "${node_pkg}" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
            echo "node_package_json=${node_pkg}" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust checks
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify AOEM Linux runtime materialization
        shell: bash
        run: |
          set -euo pipefail
          runtime="aoem/linux/core/bin/libaoem_ffi.so"
          if [[ ! -f "$runtime" ]]; then
            echo "AOEM Linux runtime is missing: $runtime" >&2
            exit 1
          fi
          if head -c 128 "$runtime" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
            echo "AOEM Linux runtime is still a Git LFS pointer: $runtime" >&2
            exit 1
          fi
          magic="$(od -An -N4 -tx1 "$runtime" | tr -d '[:space:]')"
          if [[ "$magic" != "7f454c46" ]]; then
            echo "AOEM Linux runtime is not an ELF binary: $runtime (magic=$magic)" >&2
            exit 1
          fi
          echo "AOEM Linux runtime materialized: $runtime"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify restored product and preserved component boundaries
        shell: pwsh
        run: ./runtime/check-isolation.ps1

      - name: Format check
        run: cargo fmt --manifest-path "${{ needs.detect.outputs.rust_manifest }}" --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path "${{ needs.detect.outputs.rust_manifest }}" --all-targets -- -D warnings

      - name: NOVOVM control-plane portability tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovmctl

      - name: Typed integer wire contracts and original Transfer policy assets
        # Pure schema/policy checks only. Ignored Vulkan tests require an explicit
        # GPU run; a hosted runner pass is not evidence of GPU execution or TPS.
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '0'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p novovm-exec --lib semantic_integer --locked -- --test-threads=1
          cargo test -p novovm-node --lib transfer_semantic --locked -- --test-threads=1

      - name: Consensus authority, versioned evidence and native candidate wiring
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '0'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p novovm-consensus --lib native_seal_authority --locked
          cargo test -p novovm-node --lib validator_authority_is_owned_by_consensus --locked
          cargo test -p novovm-consensus --lib round_bft --locked
          cargo test -p novovm-node --lib round_bft_candidate --locked -- --test-threads=1

      - name: Reject legacy Host writes by default during product restoration
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib restoration_host_guard --locked -- --test-threads=1

      - name: Original AOEM Transfer and recovery without Host compatibility permission
        timeout-minutes: 10
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '0'
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib candidate_workspace_record_profile_fresh_transfers_recover_and_finalize --locked -- --test-threads=1

      - name: Resident compute and finalized wallet queries without Host permission
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '0'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p novovm-exec --lib semantic_compute --locked -- --include-ignored --test-threads=1
          cargo test -p novovm-exec --lib graph_owner --locked -- --include-ignored --test-threads=1
          cargo test -p novovm-exec --lib graph_scope --locked -- --include-ignored --test-threads=1
          cargo test -p novovm-node --lib candidate_worker --locked -- --test-threads=1
          cargo test -p novovm-node --lib unregistered_reclaim_journal_codec --locked -- --test-threads=1
          cargo test -p novovm-node --lib record_auth_ --locked -- --test-threads=1
          cargo test -p novovm-node --lib native_state_tree --locked -- --test-threads=2
          cargo test -p novovm-node --lib fresh_pool_tests --locked -- --test-threads=1
          cargo test -p novovm-node --lib finalized_nov_balance --locked -- --test-threads=1
          cargo test -p novovm-node --lib native_fresh_rpc --locked -- --test-threads=1

      - name: Native seal safety and authenticated WSS lifecycle regressions
        timeout-minutes: 20
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib native_block_seal --locked -- --test-threads=2

      - name: Original Transfer single-graph business effects and serial parity
        # Include real packaged SDK tests; a pure helper pass is insufficient.
        timeout-minutes: 10
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '0'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p novovm-node --lib native_transfer_executor --locked -- --include-ignored --test-threads=1
          cargo test -p novovm-node --lib native_transfer_dispatch --locked -- --include-ignored --test-threads=1

      - name: Durable ledger and isolated candidate evidence regressions
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib native_block_ledger --locked -- --test-threads=2

      - name: Fresh genesis configuration and no-history boundary
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib tx_ingress::fresh_genesis::tests --locked -- --test-threads=2

      - name: Balance-backed treasury deposit and attestation boundaries (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib treasury_deposit_transition --locked -- --test-threads=1

      - name: Funded signed deposit restart and replay regression (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib committed_native_nonce_is_restart_durable_and_exact_replay_is_idempotent --locked -- --test-threads=1

      - name: Production business configuration pin regression (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib production_aoem_gate_requires_matching_cross_machine_protocol_pin --locked -- --test-threads=1

      - name: Funded pipeline execution and session recovery regression (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        timeout-minutes: 10
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --bin novovm-node native_execution_pipeline_tests --locked -- --test-threads=1

      - name: Funded gate accounting rejection tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --bin supervm-native-pipeline-dual-node-gate dual_node_funded_fixture --locked

      - name: Four-service real AOEM quorum diagnostics (historical comparison only)
        # Run 36565639881 failed this case, then the enclosing 30-minute suite
        # timed out before libtest printed the captured failure. Run it once in
        # isolation with immediate output; do not waive its safety assertions.
        timeout-minutes: 12
        env:
          RUST_BACKTRACE: "1"
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib candidate_workspace_execution_configured_services_real_aoem_quorum_and_restart --locked -- --test-threads=1 --nocapture

      - name: Funded candidate execution and multi-process recovery (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        # Run 36374466713 spent ~13 minutes passing the first three cases.
        # Allow the full sequential suite; per-worker 90s deadlines stay intact.
        timeout-minutes: 30
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib tx_ingress::tests::candidate_workspace_tests::candidate_workspace_execution_ --locked -- --test-threads=1 --skip candidate_workspace_execution_configured_services_real_aoem_quorum_and_restart

      - name: Funded real-node candidate and restart parity (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        timeout-minutes: 15
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --test native_candidate_node_cli --locked -- --test-threads=1

      - name: Durable user ingress and multi-height process recovery (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib fresh_pool_tests --locked -- --test-threads=1
          cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib native_fresh_rpc --locked -- --test-threads=1
          cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --test native_candidate_node_cli --locked --no-run --message-format=json > "$RUNNER_TEMP/fresh-process-build.jsonl"
          binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "native_candidate_node_cli" and .profile.test) | .executable // empty' "$RUNNER_TEMP/fresh-process-build.jsonl")
          test -x "$binary"
          sudo unshare --net sh -c 'ip link set lo up; exec env NOVOVM_ALLOW_LEGACY_HOST_EXECUTION=1 "$1" fresh_genesis_main_nodes_continue_three_heights_without_restart --ignored --test-threads=1' fresh-process-gate "$binary"

      - name: Upload user ingress and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-ingress-history-recovery
          path: |
            artifacts/audit/candidate-node-processes/**/continuous-acceptance.json
            artifacts/audit/candidate-node-processes/**/*.process.json
            artifacts/audit/candidate-node-processes/**/*.stdout.log
            artifacts/audit/candidate-node-processes/**/*.stderr.log
          if-no-files-found: warn

      - name: Signed Transfer RPC finality and wallet recovery without Host permission
        timeout-minutes: 15
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '0'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p novovm-node --lib --locked --no-run --message-format=json > "$RUNNER_TEMP/r2-oracle-build.jsonl"
          oracle=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "novovm_node" and .profile.test) | .executable // empty' "$RUNNER_TEMP/r2-oracle-build.jsonl")
          test -x "$oracle"
          cargo test -p novovm-node --test native_candidate_node_cli --locked --no-run --message-format=json > "$RUNNER_TEMP/r2-rpc-build.jsonl"
          binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "native_candidate_node_cli" and .profile.test) | .executable // empty' "$RUNNER_TEMP/r2-rpc-build.jsonl")
          test -x "$binary"
          sudo unshare --net sh -c 'ip link set lo up; exec env NOVOVM_ALLOW_LEGACY_HOST_EXECUTION=0 NOVOVM_TRANSFER_PARITY_WORKER="$2" "$1" fresh_record_transfers_conflict_failure_serial_parity --ignored --test-threads=1' r2-product-rpc "$binary" "$oracle"

      - name: Upload signed Transfer RPC acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-node-transfer-rpc-recovery
          path: artifacts/audit/candidate-node-processes/**/mixed-*.json
          if-no-files-found: warn

      - name: Mainline soak freshness coverage and progress tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib mainline_soak::tests

      - name: Mainline soak CLI and nightly acceptance boundary tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --test mainline_soak_cli

      - name: Mainline duty report evidence acceptance tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib mainline_duty_report::tests

      - name: Product relay admission and resource-bound tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-network product_relay::tests

      - name: Product overlay handshake clock-skew and authentication tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-network --lib product_overlay::tests

      - name: Product relay client daemon and overlay tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib product_relay_

      - name: Product mainline overlay resource-bound tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib product_mainline_overlay::tests

      - name: Product durable delivery journal tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib product_delivery_journal::tests

      - name: Product evidence bounded-relay tests
        run: cargo test --manifest-path "${{ needs.detect.outputs.rust_manifest }}" -p novovm-node --lib product_evidence::tests

      - name: SuperVM Mainline Gate Runner (historical comparison only, not production)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_TARGET_DIR || true
          cargo run -p novovm-node --bin supervm-mainline-gate

      - name: Native pipeline dual-node lifecycle gate (historical comparison only)
        env:
          NOVOVM_ALLOW_LEGACY_HOST_EXECUTION: '1'
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_TARGET_DIR || true
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_TX_COUNT=8
          # Fan out to three independent receivers: exhausting the send
          # budget must never discard the sender's unexecuted transactions.
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_RECEIVER_COUNT=3
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_SENDER_ROUNDS=2
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_SENDER_ROUND_PROCESS_BUDGET_MS=180000
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_TICK_BUDGET=4
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_INGRESS_MAX_PER_TICK=4
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_UDP_BROADCAST_MAX_PER_TICK=4
          export NOVOVM_NATIVE_PIPELINE_DUAL_GATE_MIN_RECEIVER_UNSEALED_CANDIDATE_TPS_X1000=1
          cargo build -p novovm-node --bins
          cargo run -p novovm-node --bin supervm-native-pipeline-dual-node-gate

      - name: Upload mainline status artifact
        uses: actions/upload-artifact@v4
        with:
          name: supervm-mainline-status
          path: |
            artifacts/mainline-status.json
            artifacts/mainline-delivery-contract.json
          if-no-files-found: error

      - name: Upload native pipeline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervm-native-pipeline-dual-node-gate
          path: |
            artifacts/native-pipeline/native-pipeline-dual-node-gate-report.json
            artifacts/native-pipeline/native-pipeline-dual-node-gate-report.json.evidence-*/*.log
          if-no-files-found: error

  rust_security:
    name: Rust security checks
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install audit tooling
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Cargo audit
        shell: bash
        run: |
          set -euo pipefail
          cargo audit

      - name: Cargo deny
        shell: bash
        run: |
          set -euo pipefail
          cargo deny check advisories bans licenses sources

  python:
    name: Python syntax check
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '*.py' ':!:legacy/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files to check."
            exit 0
          fi
          python -m py_compile "${files[@]}"
          echo "Checked ${#files[@]} Python files."

  node:
    name: Node checks
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & Test
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ needs.detect.outputs.node_package_json }}"
          cd "$(dirname "$pkg")"
          npm ci
          npm test

  runtime_modules:
    name: Preserved runtime components / ${{ matrix.os }} (not chain acceptance)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            aoem_library: aoem/linux/core/bin/libaoem_ffi.so
          - os: windows-latest
            aoem_library: aoem/windows/core/bin/aoem_ffi.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Verify restored product and preserved component boundaries
        shell: pwsh
        run: ./runtime/check-isolation.ps1
      - run: cargo fmt --manifest-path runtime/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Shared proof relation without native dependencies (not zkVM proof)
        run: cargo clippy --manifest-path runtime/Cargo.toml -p novovm-host --lib --no-default-features --locked -- -D warnings
      - run: cargo test --manifest-path runtime/Cargo.toml --workspace --locked
      - name: Fetch only the platform AOEM binary
        env:
          AOEM_TEST_BINARY: ${{ matrix.aoem_library }}
        shell: pwsh
        run: |
          git lfs pull --include="$env:AOEM_TEST_BINARY" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real AOEM compute, durable storage and lifetime tests (not chain acceptance)
        env:
          AOEM_TEST_BINARY: ${{ matrix.aoem_library }}
        shell: pwsh
        run: |
          $env:NOVOVM_AOEM_TEST_LIBRARY = (Resolve-Path $env:AOEM_TEST_BINARY).Path
          cargo test --manifest-path runtime/Cargo.toml --workspace --release --locked -- --include-ignored --test-threads=1
          exit $LASTEXITCODE
