name: Replacement runtime modules (not mainnet acceptance)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replacement-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime_modules:
    name: Isolated runtime modules / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            aoem_library: aoem/linux/core/bin/libaoem_ffi.so
          - os: windows-latest
            aoem_library: aoem/windows/core/bin/aoem_ffi.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Reject legacy dependencies
        shell: pwsh
        run: ./runtime/check-isolation.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Fetch only the platform AOEM binary
        env:
          AOEM_TEST_BINARY: ${{ matrix.aoem_library }}
        shell: pwsh
        run: |
          git lfs pull --include="$env:AOEM_TEST_BINARY" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real AOEM compute, durable storage and lifetime tests (not chain acceptance)
        env:
          AOEM_TEST_BINARY: ${{ matrix.aoem_library }}
        shell: pwsh
        run: |
          $env:NOVOVM_AOEM_TEST_LIBRARY = (Resolve-Path $env:AOEM_TEST_BINARY).Path
          cargo test --workspace --release --locked -- --include-ignored --test-threads=1
          exit $LASTEXITCODE
