[package]
name = "novovm-transfer-guest"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=2.3.2", default-features = false, features = ["std"] }
novovm-host = { path = "../../../../novovm-host", default-features = false }

[patch.crates-io]
# Guest-only SHA-256 circuit acceleration; keep the same sha2 0.10.9 API
# and all shared business/authentication semantics. Pin the reviewed source.
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", rev = "8631fabdea7bdffa97b11868e04e73491d8e5bcf" }
# Keep ed25519-dalek 2.2.0 and verify_strict unchanged. These same-version
# transitive patches supply the zkVM field/scalar backend, not a new verifier.
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "385adda1fa3b66d9aaa8b8fcc99ddc324d33ba32" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }

[profile.release]
overflow-checks = true
