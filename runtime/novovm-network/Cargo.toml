[package]
name = "novovm-network"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
serde_json = "=1.0.149"
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
k256 = { version = "=0.13.4", features = ["ecdh", "arithmetic"] }
rand = "=0.8.5"
zeroize = { version = "=1.9.0", features = ["derive"] }
thiserror = "=1.0.69"
base64 = "=0.22.1"
sha1 = "=0.10.6"
rustls = "=0.23.45"
rustls-native-certs = "=0.8.4"
tokio = { version = "=1.50.0", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
mio = { version = "=1.1.1", default-features = false, features = ["os-poll", "net"] }

[dev-dependencies]
rcgen = "=0.12.1"
socket2 = "=0.6.1"
