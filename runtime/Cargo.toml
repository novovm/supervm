[workspace]
members = ["novovm-host", "novovm-aoem", "novovm-network"]
default-members = ["novovm-host"]
exclude = ["proofs/nov-transfer"]
resolver = "2"

# Preserved post-isolation components. The product workspace and real node
# controller live in the repository root; integration is separately reviewed.
[workspace.package]
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "=1.0.103"
sha2 = "=0.10.9"
libloading = "=0.8.9"
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }

[profile.release]
overflow-checks = true

[profile.test]
debug-assertions = true
overflow-checks = true
